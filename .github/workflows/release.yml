name: ScanCraft Release Pipeline

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release Tag (e.g. v1.1.0)'
        required: false
        default: 'v1.1.0'

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build & Publish Release via GitHub Actions
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradlew Executable
        run: chmod +x gradlew

      - name: Setup Signing Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::CRITICAL: KEYSTORE_BASE64 secret is not configured in repository secrets! Release builds strictly require the permanent production signing key."
            exit 1
          fi
          echo "Restoring permanent release keystore from repository secrets..."
          echo "$KEYSTORE_BASE64" | base64 -d > release.keystore
          if [ ! -s release.keystore ]; then
            echo "::error::Decoded release.keystore is empty or corrupted!"
            exit 1
          fi
          echo "Keystore verified successfully."

      - name: Build Release APKs (Universal & ABI Splits)
        env:
          KEYSTORE_FILE: ${{ github.workspace }}/release.keystore
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_PASSWORD" ] || [ -z "$KEY_ALIAS" ] || [ -z "$KEY_PASSWORD" ]; then
            echo "::error::CRITICAL: Missing signing secrets (KEYSTORE_PASSWORD, KEY_ALIAS, or KEY_PASSWORD). Release builds require complete credentials."
            exit 1
          fi
          ./gradlew assembleRelease --stacktrace

      - name: Clean Keystore from Runner
        if: always()
        run: rm -f release.keystore

      - name: Prepare Release Artifacts & Checksums
        id: prepare_artifacts
        env:
          REF_NAME: ${{ github.ref_name }}
          INPUT_TAG: ${{ github.event.inputs.tag_name }}
        run: |
          TAG="$REF_NAME"
          if [ -z "$TAG" ] || [ "$TAG" = "main" ]; then
            TAG="${INPUT_TAG:-v1.1.0}"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

          rm -rf release-output
          mkdir -p release-output

          # Copy and rename all release APKs (Universal & ABI Splits)
          for apk in app/build/outputs/apk/release/*.apk; do
            if [ -f "$apk" ]; then
              base=$(basename "$apk" .apk)
              suffix=$(echo "$base" | sed -e 's/^app-//' -e 's/-release$//')
              outname="ScanCraft-${TAG}-${suffix}.apk"
              cp "$apk" "release-output/${outname}"
            fi
          done

          # Generate SHA-256 checksums and export file sizes for inline Release Notes
          cd release-output
          apk_count=$(ls -1 ScanCraft-*.apk 2>/dev/null | wc -l)
          if [ "$apk_count" -eq 0 ]; then
            echo "::error::No release APKs found in release-output/"
            exit 1
          fi

          : > checksums-sha256.txt
          for apk in ScanCraft-*.apk; do
            if [ -f "$apk" ]; then
              sha256sum "$apk" >> checksums-sha256.txt
            fi
          done

          get_size() {
            local file="ScanCraft-${TAG}-${1}.apk"
            if [ -f "$file" ]; then
              awk -v b="$(stat -c%s "$file")" 'BEGIN { printf "%.1f MB\n", b / 1048576 }'
            else
              echo "N/A"
            fi
          }

          {
            echo "size_arm64=$(get_size arm64-v8a)"
            echo "size_universal=$(get_size universal)"
            echo "size_armeabi=$(get_size armeabi-v7a)"
            echo "size_x86_64=$(get_size x86_64)"
            echo "sha_block<<EOF_SHA_2026"
            cat checksums-sha256.txt
            echo "EOF_SHA_2026"
          } >> "$GITHUB_OUTPUT"
          cd ..

          echo "Release artifacts ready:"
          ls -lh release-output/

      - name: Upload Release Artifacts to Workflow
        uses: actions/upload-artifact@v4
        with:
          name: ScanCraft-${{ steps.prepare_artifacts.outputs.tag }}-APKs
          path: release-output/*
          retention-days: 30

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        with:
          name: ScanCraft ${{ steps.prepare_artifacts.outputs.tag }}
          tag_name: ${{ steps.prepare_artifacts.outputs.tag }}
          files: release-output/*.apk
          draft: false
          prerelease: false
          generate_release_notes: true
          body: |
            ### 📄 ScanCraft Release ${{ steps.prepare_artifacts.outputs.tag }}

            Official Open Source Document Scanner released under the **GNU General Public License v3.0 (GPLv3)** by **@krinry**.

            #### 📲 Direct APK Downloads
            > 💡 **Which APK should I download?** Most modern Android phones use **ARM64 (`arm64-v8a`)** (smallest & fastest). If unsure, download **Universal APK**.

            | Variant | Best For | Size | Direct Download Link |
            | :--- | :--- | :--- | :--- |
            | **ARM64 (`arm64-v8a`) ⭐ Recommended** | Modern Android phones (2018+) | ${{ steps.prepare_artifacts.outputs.size_arm64 }} | [⬇️ Download APK](https://github.com/${{ github.repository }}/releases/download/${{ steps.prepare_artifacts.outputs.tag }}/ScanCraft-${{ steps.prepare_artifacts.outputs.tag }}-arm64-v8a.apk) |
            | **Universal APK** | All Android devices | ${{ steps.prepare_artifacts.outputs.size_universal }} | [⬇️ Download APK](https://github.com/${{ github.repository }}/releases/download/${{ steps.prepare_artifacts.outputs.tag }}/ScanCraft-${{ steps.prepare_artifacts.outputs.tag }}-universal.apk) |
            | **ARMv7 (`armeabi-v7a`)** | Older 32-bit Android devices | ${{ steps.prepare_artifacts.outputs.size_armeabi }} | [⬇️ Download APK](https://github.com/${{ github.repository }}/releases/download/${{ steps.prepare_artifacts.outputs.tag }}/ScanCraft-${{ steps.prepare_artifacts.outputs.tag }}-armeabi-v7a.apk) |
            | **x86_64** | Emulators & Chromebooks | ${{ steps.prepare_artifacts.outputs.size_x86_64 }} | [⬇️ Download APK](https://github.com/${{ github.repository }}/releases/download/${{ steps.prepare_artifacts.outputs.tag }}/ScanCraft-${{ steps.prepare_artifacts.outputs.tag }}-x86_64.apk) |

            #### 🌟 Highlights
            - **Privacy First & 100% Offline**: Zero analytics, zero ad SDKs, zero user tracking beacons.
            - **Permanent Storage Vault & Pro Performance**: Fast cached thumbnails, atomic metadata writes, and reliable document recovery.
            - **Multi-Image Crop Swipe**: Swipe across captured batch pages directly inside the Crop screen.
            - **Universal Dark & Light Theme**: Complete AMOLED Dark, Light, and System theme support across every screen.
            - **Native Computer Vision & Filters**: High-speed border detection, perspective warp, Magic Color (CLAHE), B&W, Eco, and manual sliders.
            - **On-Device OCR & PDF Studio**: Multi-script text recognition (Latin, Devanagari, Chinese, Japanese), custom PDF layouts, watermarks, encryption, and digital signatures.
            - **Multi-Cloud & SAF Backup**: Direct support for Google Drive, Dropbox, OneDrive, WebDAV, and local storage.

            #### ℹ️ Package Details
            - **Author**: @krinry
            - **Application ID**: `com.krinry.scancraft`
            - **Minimum Android**: Android 8.0 (API 26)
            - **Target Android**: Android 14+ (API 34/35)
            - **License**: GNU General Public License v3.0 (GPLv3)

            <details>
            <summary>🔐 SHA-256 Checksums (For Verification Only)</summary>

            ```text
            ${{ steps.prepare_artifacts.outputs.sha_block }}
            ```
            </details>
